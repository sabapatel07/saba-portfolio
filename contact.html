<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact Saba Patel | Portfolio</title>

    <meta name="description"
        content="Contact Saba Patel for web development, AI projects and collaboration opportunities.">

    <meta name="author"
        content="Saba Patel">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>


    <header>

        <nav aria-label="Main navigation">

            <div class="logo">
                <a href="index.html">
                    Saba Patel
                </a>
            </div>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="projects.html">Projects</a></li>

                <li><a href="skills.html">Skills</a></li>

                <li><a href="resume.html">Resume</a></li>

                <li>
                    <a href="contact.html"
                       aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">
                Contact Me
            </h1>

            <p>
                Have a question, project idea or opportunity?
                Feel free to contact me.
            </p>


            <form action="#" method="post">

                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true">

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        required
                        aria-required="true"></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>

        </p>

    </footer>

</body>
